name: CI - Tharqiya

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - Install & Generate
        run: |
          cd backend
          npm install
          npx prisma generate

      - name: Backend - Type Check
        run: |
          cd backend
          npx tsc --noEmit

      - name: Frontend - Install & Build
        run: |
          cd frontend
          npm install
          npm run build
